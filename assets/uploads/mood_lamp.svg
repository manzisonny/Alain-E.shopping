<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd60a;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#ff6b35;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fffde7"/>
      <stop offset="40%" style="stop-color:#ffd60a"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <!-- Ambient glow background -->
  <circle cx="200" cy="155" r="100" fill="url(#lamp-glow)" filter="url(#blur-glow)" opacity="0.6"/>
  <!-- Lamp body (sphere) -->
  <circle cx="200" cy="140" r="65" fill="url(#orb)" opacity="0.9"/>
  <circle cx="200" cy="140" r="65" fill="rgba(255,255,255,0)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Inner reflection -->
  <ellipse cx="180" cy="118" rx="22" ry="14" fill="rgba(255,255,255,0.35)" transform="rotate(-25, 180, 118)"/>
  <!-- Base -->
  <rect x="175" y="200" width="50" height="12" rx="6" fill="#1e1e38" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="165" y="208" width="70" height="8" rx="4" fill="#16213e" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Wifi icon -->
  <path d="M193 232 Q200 226 207 232" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M187 238 Q200 229 213 238" fill="none" stroke="#667eea" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="244" r="3" fill="#00d9ff"/>
  <!-- Sound waves -->
  <path d="M240 120 Q250 140 240 160" fill="none" stroke="rgba(255,214,10,0.5)" stroke-width="2"/>
  <path d="M250 110 Q265 140 250 170" fill="none" stroke="rgba(255,214,10,0.3)" stroke-width="1.5"/>
  <path d="M160 120 Q150 140 160 160" fill="none" stroke="rgba(255,214,10,0.5)" stroke-width="2"/>
  <path d="M150 110 Q135 140 150 170" fill="none" stroke="rgba(255,214,10,0.3)" stroke-width="1.5"/>
  <!-- Label -->
  <text x="200" y="275" font-family="Inter, sans-serif" font-size="13" fill="#b4b4c8" text-anchor="middle" font-weight="600">Smart Ambient Mood Lamp</text>
  <text x="200" y="293" font-family="Inter, sans-serif" font-size="11" fill="#6e7191" text-anchor="middle">WiFi Enabled · Home &amp; Living</text>
</svg>
