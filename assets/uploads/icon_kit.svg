<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e38"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#667eea" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <!-- Grid of icon cards -->
  <g filter="url(#glow)">
    <!-- Row 1 -->
    <rect x="80" y="60" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="145" y="60" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="210" y="60" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="275" y="60" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="80" y="125" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="145" y="125" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="210" y="125" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="275" y="125" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <!-- Row 3 (partial) -->
    <rect x="80" y="190" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="145" y="190" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="210" y="190" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
    <rect x="275" y="190" width="55" height="55" rx="12" fill="url(#card)" stroke="rgba(102,126,234,0.5)" stroke-width="1"/>
  </g>
  <!-- Icon symbols (simplified SVG icons) -->
  <circle cx="107" cy="87" r="12" fill="rgba(0,217,255,0.5)" stroke="#00d9ff" stroke-width="1.5"/>
  <rect x="162" y="76" width="22" height="22" rx="3" fill="rgba(255,0,110,0.5)" stroke="#ff006e" stroke-width="1.5"/>
  <polygon points="237,73 247,93 227,93" fill="rgba(0,245,160,0.5)" stroke="#00f5a0" stroke-width="1.5"/>
  <path d="M285 80 L315 80 M285 87 L310 87 M285 94 L305 94" stroke="#ffd60a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second row icons -->
  <path d="M95 142 Q107 132 119 142 Q119 155 107 158 Q95 155 95 142 Z" fill="rgba(102,126,234,0.5)" stroke="#667eea" stroke-width="1.5"/>
  <rect x="155" y="135" width="35" height="35" rx="6" fill="none" stroke="#00d9ff" stroke-width="2"/>
  <line x1="155" y1="152" x2="190" y2="152" stroke="#00d9ff" stroke-width="1.5"/>
  <!-- Download arrow badge -->
  <circle cx="340" cy="90" r="25" fill="rgba(0,245,160,0.15)" stroke="#00f5a0" stroke-width="2"/>
  <path d="M330 82 L350 82 L340 98 Z" fill="#00f5a0"/>
  <line x1="340" y1="98" x2="340" y2="104" stroke="#00f5a0" stroke-width="2.5"/>
  <line x1="330" y1="106" x2="350" y2="106" stroke="#00f5a0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Label -->
  <text x="200" y="270" font-family="Inter, sans-serif" font-size="13" fill="#b4b4c8" text-anchor="middle" font-weight="600">Complete UI Icon Kit</text>
  <text x="200" y="288" font-family="Inter, sans-serif" font-size="11" fill="#6e7191" text-anchor="middle">500+ Icons · Digital Download</text>
</svg>
