<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e38"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00d9ff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <!-- Hoodie body -->
  <path d="M130 110 Q150 90 200 90 Q250 90 270 110 L285 155 L265 165 L250 130 L250 260 L150 260 L150 130 L135 165 L115 155 Z" fill="url(#hoodie)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Hood -->
  <path d="M160 110 Q200 80 240 110 Q230 95 200 92 Q170 95 160 110 Z" fill="#16213e" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Neon stripes - left sleeve -->
  <path d="M132 118 L150 130" stroke="#00d9ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M120 133 L142 148" stroke="#667eea" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M117 148 L135 163" stroke="#ff006e" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Neon stripes - right sleeve -->
  <path d="M268 118 L250 130" stroke="#00d9ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M280 133 L258 148" stroke="#667eea" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M283 148 L265 163" stroke="#ff006e" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Front pocket -->
  <path d="M170 200 Q200 193 230 200 L232 235 Q200 242 168 235 Z" fill="rgba(0,217,255,0.1)" stroke="rgba(0,217,255,0.3)" stroke-width="1.5"/>
  <!-- Ambient glow behind -->
  <ellipse cx="200" cy="190" rx="80" ry="100" fill="rgba(0,217,255,0.05)"/>
  <!-- Label -->
  <text x="200" y="285" font-family="Inter, sans-serif" font-size="13" fill="#b4b4c8" text-anchor="middle" font-weight="600">Futuristic Neon Hoodie</text>
  <text x="200" y="303" font-family="Inter, sans-serif" font-size="11" fill="#6e7191" text-anchor="middle">Luminous Edition · Fashion</text>
</svg>
