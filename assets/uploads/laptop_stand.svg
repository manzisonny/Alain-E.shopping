<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#667eea" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <!-- RGB glow -->
  <ellipse cx="200" cy="200" rx="120" ry="30" fill="rgba(102,126,234,0.3)" filter="url(#glow)"/>
  <!-- Laptop base (stand) -->
  <path d="M120 200 L280 200 L260 230 L140 230 Z" fill="url(#g1)" rx="5" opacity="0.9"/>
  <!-- Stand pole -->
  <rect x="190" y="170" width="20" height="32" fill="#764ba2" rx="3"/>
  <!-- Laptop screen -->
  <rect x="100" y="80" width="200" height="140" rx="12" fill="#1e1e38" stroke="url(#g1)" stroke-width="3" filter="url(#glow)"/>
  <!-- Screen content -->
  <rect x="115" y="95" width="170" height="110" rx="6" fill="#0f0f23"/>
  <!-- RGB strips on stand -->
  <path d="M120 200 L140 200" stroke="#ff006e" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 200 L180 200" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 200 L220 200" stroke="#00d9ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M230 200 L260 200" stroke="#00f5a0" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 200 L280 200" stroke="#ffd60a" stroke-width="4" stroke-linecap="round"/>
  <!-- Screen display lines -->
  <line x1="130" y1="115" x2="210" y2="115" stroke="#667eea" stroke-width="2" opacity="0.7"/>
  <line x1="130" y1="130" x2="250" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="130" y1="145" x2="240" y2="145" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="130" y1="160" x2="200" y2="160" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Label -->
  <text x="200" y="290" font-family="Inter, sans-serif" font-size="13" fill="#b4b4c8" text-anchor="middle" font-weight="600">Premium Cyberpunk Laptop Stand</text>
  <text x="200" y="308" font-family="Inter, sans-serif" font-size="11" fill="#6e7191" text-anchor="middle">RGB Edition · Electronics</text>
</svg>
